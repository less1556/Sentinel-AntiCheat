name: Build Sentinel AntiCheat

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      run: |
        msbuild /p:Configuration=Release /p:Platform=x86
      # Nota: Ajusta la plataforma a x64 o la ruta del archivo .sln/.vcxproj según la estructura del proyecto.

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Sentinel-AntiCheat-Build
        path: |
          **/Release/*.dll
          **/Release/*.exe
          **/Release/*.so
