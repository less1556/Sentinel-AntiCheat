- name: Build with CMake / Make
      run: |
        if [ -f "CMakeLists.txt" ]; then
          mkdir -p build && cd build
          # Desactivamos Tests y construimos directamente
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DSENTINEL_BUILD_TESTS=OFF \
                -DSENTINEL_BUILD_EXAMPLES=OFF \
                -DBUILD_TESTING=OFF \
                -DBUILD_EXAMPLES=OFF .. || {
                  echo "Si CMake falla por la carpeta 'examples', removemos la línea problemática:"
                  sed -i '/add_subdirectory(examples)/d' ../CMakeLists.txt
                  sed -i '/add_subdirectory(tests)/d' ../CMakeLists.txt
                  cmake -DCMAKE_BUILD_TYPE=Release ..
                }
          make -j$(nproc)
        elif [ -f "Makefile" ]; then
          make -j$(nproc)
        fi
