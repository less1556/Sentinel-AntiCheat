name: Build Sentinel AntiCheat (Linux)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (32-bit & build tools)
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-multilib g++-multilib cmake make

- name: Build with CMake / Make
      run: |
        if [ -f "CMakeLists.txt" ]; then
          mkdir -p build && cd build
          # Desactivamos Tests y construimos directamente
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DSENTINEL_BUILD_TESTS=OFF \
                -DSENTINEL_BUILD_EXAMPLES=OFF \
                -DBUILD_TESTING=OFF \
                -DBUILD_EXAMPLES=OFF .. || {
                  echo "Si CMake falla por la carpeta 'examples', removemos la línea problemática:"
                  sed -i '/add_subdirectory(examples)/d' ../CMakeLists.txt
                  sed -i '/add_subdirectory(tests)/d' ../CMakeLists.txt
                  cmake -DCMAKE_BUILD_TYPE=Release ..
                }
          make -j$(nproc)
        elif [ -f "Makefile" ]; then
          make -j$(nproc)
        fi

    - name: Upload Linux Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Sentinel-AntiCheat-Linux
        path: |
          **/*.so
          build/*.so
          bin/*.so
