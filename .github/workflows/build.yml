name: Build Sentinel AntiCheat (Linux)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (32-bit & build tools)
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-multilib g++-multilib cmake make

    - name: Build with CMake / Make
      run: |
        if [ -f "CMakeLists.txt" ]; then
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
        elif [ -f "Makefile" ]; then
          make -j$(nproc)
        else
          echo "No se encontró Makefile ni CMakeLists.txt. Compilando archivos .cpp directamente..."
          mkdir -p bin
          g++ -m32 -O2 -shared -fPIC src/*.cpp -o bin/sentinel_mm_i386.so
        fi

    - name: Upload Linux Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Sentinel-AntiCheat-Linux
        path: |
          **/*.so
          build/*.so
          bin/*.so
